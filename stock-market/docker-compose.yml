services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: stock_market
      POSTGRES_PASSWORD: stock_market
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_market"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stock_market
      SPRING_DATASOURCE_USERNAME: stock_market
      SPRING_DATASOURCE_PASSWORD: stock_market
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app